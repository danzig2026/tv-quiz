name: Build TV Debug APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: uriz/android-sdk:latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        working-directory: ./tv_quiz_lock-master
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: tv_quiz_lock-master/app/build/outputs/apk/debug/app-debug.apk
